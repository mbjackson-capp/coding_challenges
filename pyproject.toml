[project]
name = "coding-challenges"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "advent-of-code-data",
    "aocd-example-parser",
    "beautifulsoup4",
    "matplotlib",
    "networkx",
    "numpy",
    "pandas",
    "pebble",
    "pulp",
    "shapely",
    "soupsieve",
    "tqdm",
    "urllib3",
]

# make the repo an installable package, so solution files can import from top-level myutils
# when run with `uv run`
[build-system]
requires = ["uv_build>=0.13.1,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "myutils"
module-root = ""

[dependency-groups]
dev = [
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 99

[tool.ruff.lint]
extend-select = ["E501"]